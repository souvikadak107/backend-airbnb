version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    networks:
      - fullstack_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fullstack_network
    restart: unless-stopped

networks:
  fullstack_network:
    driver: bridge